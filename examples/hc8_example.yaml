# ==========================================
#   Пример: HC8 CO2 sensor + ESP32
# ==========================================

esphome:
  name: co2-sensor
  friendly_name: "Датчик CO2"

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "CO2 Fallback Hotspot"
    password: "changeme123"

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

logger:
  level: DEBUG

uart:
  - id: uart_hc8
    tx_pin: GPIO5   # идёт в RX датчика
    rx_pin: GPIO4   # идёт в TX датчика
    baud_rate: 9600

sensor:
  - platform: hc8_full
    uart_id: uart_hc8
    update_interval: 60s
    co2:
      name: "CO₂"
      id: local_co2